dist: xenial
sudo: required

before_install:
  - sudo ./install-dependencies.sh

install:
  - rm -rf public

script:
  - rvm use default
  - /snap/bin/hugo
  - pushd public && htmlproofer --disable-external --allow-hash-href --alt-ignore /images/gopher-404.jpg --file-ignore /revealjs/ . && popd

deploy:
  provider: pages
  skip_cleanup: true
  local_dir: public
  github_token: $GITHUB_TOKEN # Set in travis-ci.org dashboard
  on:
    branch: master
  repo: psu-ccbb/psu-ccbb.github.io
  target_branch: master
  fqdn: www.ccbb.psu.edu

env:
  global:
    - RUBY_RELEASE=2.6.7
