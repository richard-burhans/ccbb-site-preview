<!DOCTYPE html>
<html lang="{{ or site.Language.Locale "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to main content</a>
    {{ partial "site-header.html" . }}
    <div class="layout">
      {{ partial "site-nav.html" . }}
      <main class="content" id="content">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    {{ partial "site-footer.html" . }}
  </body>
</html>
