name: Build and Deploy Site

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # The site is time-aware: which talk is "next", which seasons count as recent,
  # and the upcoming list on the home page are all worked out at build time.
  # Without a scheduled build those would freeze at whenever someone last
  # pushed, and a talk would stay listed as upcoming after it had happened.
  # 07:00 UTC is roughly 2-3am in State College, depending on the season.
  schedule:
    - cron: '0 7 * * *'

# Hugo is pinned rather than floating on "latest" so a Hugo release can never
# break a deploy without someone choosing to take the upgrade.
env:
  HUGO_VERSION: '0.164.0'
  # Without a UTF-8 locale, nokogiri reads pages as US-ASCII and html-proofer
  # skips every file containing a non-ASCII character -- then still reports
  # success. Several speaker names and talk titles are non-ASCII.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # The repository that owns the live site. Anything else -- a fork, a preview
  # clone -- builds and publishes to its own GitHub Pages instead, and can never
  # reach the production site. See "Deploy" below.
  PRODUCTION_REPO: psu-ccbb/ccbb-site

permissions:
  contents: write   # a fork/preview publishes to its own gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # The "Add"/"Edit" links point at whichever repository built the site, so
      # a preview clone's forms open against the preview -- never against
      # production. config.yml only supplies the fallback for local builds.
      HUGO_PARAMS_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      # Runs before anything is built. A misspelled key is not an error to Hugo
      # -- it renders as empty and deploys silently -- so this is the only thing
      # standing between a typo and a speaker's name vanishing from the site.
      - name: Validate seminar data
        run: python3 scripts/validate_seminars.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Work out the base URL
        id: site
        run: |
          if [ "${{ github.repository }}" = "${{ env.PRODUCTION_REPO }}" ]; then
            echo "base=https://www.ccbb.psu.edu/" >> "$GITHUB_OUTPUT"
            echo "prefix=" >> "$GITHUB_OUTPUT"
          else
            # A preview repo publishes at owner.github.io/<repo>/, so the site
            # is served from a subdirectory rather than the domain root.
            # Derived from GITHUB_REPOSITORY rather than github.event.repository,
            # which is not populated on scheduled runs.
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY#*/}"
            echo "base=https://${owner}.github.io/${name}/" >> "$GITHUB_OUTPUT"
            # html-proofer checks files on disk, which are not under the
            # subdirectory the links are prefixed with. Tell it what to strip.
            echo "prefix=/${name}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Site
        run: hugo --minify --baseURL "${{ steps.site.outputs.base }}"

      - name: Check Site
        working-directory: ./public
        env:
          SITE_PATH_PREFIX: ${{ steps.site.outputs.prefix }}
        run: bundle exec ../ccbb-htmlproofer

      # Two failures html-proofer cannot see: links with no text, and internal
      # links missing the site's base path. Both resolve on disk, so the link
      # check passes while the page is wrong in a browser.
      - name: Check rendered output
        run: python3 scripts/check_rendered.py public --base-path "${{ steps.site.outputs.prefix }}"

      # Only master deploys. Pull requests build and link-check so a broken
      # change is caught before it can reach the live site.
      #
      # The repository guard matters: without it, any fork or preview clone that
      # happened to hold a valid token would publish to the production site.
      - name: Deploy Site
        if: >-
          github.repository == 'psu-ccbb/ccbb-site' &&
          github.ref == 'refs/heads/master' &&
          github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./public
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: psu-ccbb/psu-ccbb.github.io
          publish_branch: master
          cname: www.ccbb.psu.edu
          force_orphan: true

      # Preview clones publish to their own Pages, using the built-in token --
      # no secret to configure, and no way to reach production.
      - name: Deploy preview
        if: >-
          github.repository != 'psu-ccbb/ccbb-site' &&
          github.ref == 'refs/heads/master' &&
          github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./public
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          force_orphan: true
